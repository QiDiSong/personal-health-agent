[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-health-agent"
version = "0.1.0"
description = "Private personal health API and MCP tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "mcp>=1.20,<2", "python-dotenv>=1.2,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
health-agent = "health_agent.api:run"
health-agent-mcp = "health_agent.mcp_server:run"
health-agent-report = "health_agent.report:run"

[tool.setuptools.packages.find]
include = ["health_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
